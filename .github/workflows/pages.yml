name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public site
        run: |
          mkdir -p _site/data _site/icons
          cp index.html app.js fx.js styles.css manifest.webmanifest sw.js .nojekyll _site/
          cp -a data/ja _site/data/
          cp -a icons/. _site/icons/
          test -f _site/data/ja/terms.min.json
          test -f _site/data/ja/reading-semantics-runtime.json
          test ! -e _site/.codex
          test ! -e _site/scripts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
